<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Age of Missalera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #100c09; color: #f7ecd4; font-family: Georgia, serif; }
  #app { height: 100dvh; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; background: #3a2718; border-bottom: 3px solid #c9a15b; }
  b { color: #f0c56a; letter-spacing: .08em; font-size: 13px; }
  #hud { font-size: 12px; text-align: right; }
  #stage { position: relative; flex: 1; min-height: 220px; }
  canvas { width: 100%; height: 100%; display: block; background: #6d8448; touch-action: none; }
  #log { position: absolute; left: 8px; right: 8px; top: 8px; background: rgba(16,10,6,.78); border: 1px solid #c9a15b; border-radius: 8px; padding: 7px 9px; font-size: 13px; }
  #controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; padding: 8px; background: #140e0a; }
  button { font-family: inherit; font-size: 16px; padding: 14px 4px; border-radius: 10px; border: 1px solid #e2b65a; background: #2c4468; color: #f7ecd4; }
  #menu, #end { position: absolute; inset: 0; z-index: 5; overflow: auto; background: rgba(8,6,4,.9); padding: 14px; }
  .card { background: #f6e7cb; color: #1b130c; border: 3px solid #6b4a28; border-radius: 12px; padding: 14px; }
  .card h1 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 8px 0; }
  .card button { width: 100%; margin: 6px 0; text-align: left; background: #efe0c0; color: #1b130c; }
  .hide { display: none; }
</style>
</head>
<body>
<div id="app">
  <header><b>AGE OF MISSALERA</b><div id="hud">Choose a banner</div></header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="log">Tap a mission. This page does not need extra files.</div>
    <div id="menu"><div class="card">
      <h1>Age of Missalera</h1>
      <p>Collect banners. Swords beat horses. Horses break archers. Archers cut swords.</p>
      <div id="list"></div>
    </div></div>
    <div id="end" class="hide"><div class="card">
      <h1 id="endTitle">Done</h1>
      <p id="endText"></p>
      <button id="back" type="button">Back</button>
    </div></div>
  </div>
  <div id="controls">
    <button id="all" type="button">All</button>
    <button id="atk" type="button">Attack</button>
    <button id="hold" type="button">Hold</button>
    <button id="pow" type="button">Power</button>
  </div>
</div>
<script>
var TYPES = {
  sword: { name: "Swords", hp: 110, dmg: 16, range: 28, speed: 70, cd: 0.68, color: "#8c3b2a" },
  horse: { name: "Horses", hp: 90, dmg: 18, range: 30, speed: 118, cd: 0.66, color: "#6b4a1f" },
  harc: { name: "Bows", hp: 64, dmg: 10, range: 120, speed: 122, cd: 0.8, color: "#3e5c3a" },
  archer: { name: "Archers", hp: 52, dmg: 12, range: 132, speed: 62, cd: 0.82, color: "#2f4d6e" }
};
var POWERS = { wedge: "Wedge", stampede: "Stampede", volley: "Volley" };
var MISSIONS = [
  { title: "I Dust Gate", brief: "Collect the swords.", start: [["sword", 5], ["archer", 2]], banners: [[0.36, 0.42, "Dust Gate", [["sword", 5]], "wedge"], [0.7, 0.62, "Salt Well", [["archer", 3]]]], foes: [["sword", 6, 0.72, 0.36], ["archer", 4, 0.8, 0.58]], win: "clear" },
  { title: "II Horse Road", brief: "Cavalry on the road.", start: [["sword", 4], ["horse", 2]], banners: [[0.3, 0.32, "Mare Post", [["horse", 4]], "stampede"], [0.64, 0.7, "Reed Ford", [["harc", 3]]]], foes: [["horse", 5, 0.76, 0.3], ["archer", 4, 0.8, 0.55]], win: "clear" },
  { title: "III Orchard", brief: "Horse bows against archers.", start: [["sword", 3], ["harc", 3]], banners: [[0.4, 0.28, "Orchard", [["harc", 4]], "volley"], [0.72, 0.72, "Kiln", [["sword", 4]]]], foes: [["archer", 7, 0.74, 0.32], ["sword", 4, 0.58, 0.5]], win: "clear" },
  { title: "IV Three Oaths", brief: "Take all three.", start: [["sword", 4], ["horse", 2], ["archer", 2]], banners: [[0.26, 0.34, "Steel", [["sword", 4]], "wedge"], [0.5, 0.66, "Hoof", [["horse", 3]], "stampede"], [0.76, 0.3, "String", [["archer", 4]], "volley"]], foes: [["sword", 5, 0.55, 0.28], ["horse", 4, 0.82, 0.55], ["archer", 4, 0.4, 0.75]], win: "banners" },
  { title: "V Collector", brief: "They take banners too.", start: [["sword", 5], ["horse", 2], ["archer", 2]], banners: [[0.4, 0.4, "Copper", [["sword", 5]], "wedge"], [0.68, 0.42, "Stable", [["horse", 3], ["harc", 2]], "stampede"]], foes: [["sword", 6, 0.55, 0.66], ["horse", 4, 0.82, 0.28], ["archer", 4, 0.78, 0.7]], enemyCollects: true, win: "clear" },
  { title: "VI Capital", brief: "Gold flag, then break them.", start: [["sword", 6], ["horse", 2], ["harc", 2], ["archer", 3]], banners: [[0.28, 0.28, "West", [["sword", 4]], "wedge"], [0.28, 0.72, "Stables", [["horse", 3], ["harc", 2]], "stampede"], [0.52, 0.48, "Bell", [["archer", 4]], "volley"], [0.78, 0.38, "Capital", [["sword", 3], ["horse", 2]], null, 1]], foes: [["sword", 7, 0.72, 0.3], ["horse", 4, 0.84, 0.55], ["harc", 3, 0.66, 0.62], ["archer", 5, 0.78, 0.2]], win: "capital" }
];
var canvas = document.getElementById("c");
var ctx = canvas.getContext("2d");
var hud = document.getElementById("hud");
var log = document.getElementById("log");
var W = 360, H = 480, state = null, last = 0;
function say(t) { log.textContent = t; }
function fit() {
  var s = document.getElementById("stage");
  W = Math.max(280, s.clientWidth || window.innerWidth);
  H = Math.max(240, s.clientHeight || 420);
  canvas.width = W; canvas.height = H;
}
function unit(type, side, x, y) {
  var spec = TYPES[type];
  return { type: type, side: side, x: x, y: y, hp: spec.hp, max: spec.hp, cd: Math.random() * 0.3, tx: x, ty: y, target: null, sel: false, stun: 0, alive: true, hold: false };
}
function group(list, side, ox, oy) {
  var out = [], i = 0, a, g, n, k;
  for (a = 0; a < list.length; a++) for (n = 0, k = list[a][1]; n < k; n++, i++) out.push(unit(list[a][0], side, ox + Math.cos(i) * 16, oy + Math.sin(i) * 16));
  return out;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function nearest(u, max) {
  var best = null, bd = max || 9999, i, d;
  for (i = 0; i < state.units.length; i++) if (state.units[i].alive && state.units[i].side !== u.side) { d = dist(u, state.units[i]); if (d < bd) { bd = d; best = state.units[i]; } }
  return best;
}
function mul(a, d) {
  if (a === "sword" && d === "horse") return 1.6;
  if (a === "horse" && (d === "archer" || d === "harc")) return 1.5;
  if (a === "archer" && d === "sword") return 1.55;
  if (a === "harc" && d === "sword") return 1.25;
  if (a === "horse" && d === "sword") return 0.65;
  return 1;
}
function start(m) {
  fit();
  var units = group(m.start, "player", W * 0.16, H * 0.55);
  var i, f;
  for (i = 0; i < m.foes.length; i++) { f = m.foes[i]; units = units.concat(group([[f[0], f[1]]], "enemy", W * f[2], H * f[3])); }
  state = { m: m, over: null, powers: {}, cd: { wedge: 0, stampede: 0, volley: 0 }, units: units, banners: m.banners.map(function (b) { return { x: W * b[0], y: H * b[1], name: b[2], grant: b[3], power: b[4], capital: b[5], progress: 0, done: false, owner: null, hold: b[5] ? 6 : 4 }; }) };
  document.getElementById("menu").classList.add("hide");
  document.getElementById("end").classList.add("hide");
  say(m.brief);
}
function claim(b, side) {
  if (b.done) return;
  b.done = true; b.owner = side;
  state.units = state.units.concat(group(b.grant, side, b.x, b.y + 24));
  if (side === "player" && b.power) state.powers[b.power] = true;
  say(side === "player" ? b.name + " sworn" : "They took " + b.name);
}
function stepTo(u, x, y, s) {
  var d = Math.hypot(x - u.x, y - u.y); if (d < 1) return;
  var m = Math.min(s, d); u.x += (x - u.x) / d * m; u.y += (y - u.y) / d * m;
}
function finish(win, text) {
  state.over = win ? "win" : "lose";
  document.getElementById("endTitle").textContent = win ? "Host holds" : "Host broken";
  document.getElementById("endText").textContent = text;
  document.getElementById("end").classList.remove("hide");
}
function tick(dt) {
  if (!state || state.over) return;
  var k, u, spec, foe, b, p, e, mine, done, ea;
  for (k in state.cd) state.cd[k] = Math.max(0, state.cd[k] - dt);
  for (k = 0; k < state.units.length; k++) {
    u = state.units[k]; if (!u.alive) continue;
    u.stun = Math.max(0, u.stun - dt); u.cd = Math.max(0, u.cd - dt);
    if (u.stun > 0) continue;
    spec = TYPES[u.type];
    foe = u.target && u.target.alive ? u.target : null;
    if (!foe && !u.hold) foe = nearest(u, u.side === "enemy" ? 240 : 380);
    if (foe) {
      u.target = foe;
      if (dist(u, foe) <= spec.range) { if (u.cd <= 0) { foe.hp -= spec.dmg * mul(u.type, foe.type); u.cd = spec.cd; if (foe.hp <= 0) foe.alive = false; } }
      else stepTo(u, foe.x, foe.y, spec.speed * dt);
    } else if (dist(u, { x: u.tx, y: u.ty }) > 6) stepTo(u, u.tx, u.ty, spec.speed * dt);
  }
  for (k = 0; k < state.banners.length; k++) {
    b = state.banners[k]; if (b.done) continue;
    p = state.units.filter(function (u) { return u.alive && u.side === "player" && dist(u, b) < 64; }).length;
    e = state.units.filter(function (u) { return u.alive && u.side === "enemy" && dist(u, b) < 64; }).length;
    if (p > e && p) b.progress += dt;
    else if (state.m.enemyCollects && e > p && e) b.progress -= dt * 0.7;
    else b.progress = Math.max(0, b.progress - dt * 0.25);
    if (b.progress >= b.hold) claim(b, "player");
    if (b.progress <= -b.hold && state.m.enemyCollects) claim(b, "enemy");
  }
  mine = state.units.filter(function (u) { return u.alive && u.side === "player"; });
  ea = state.units.some(function (u) { return u.alive && u.side === "enemy"; });
  done = state.banners.filter(function (b) { return b.done && b.owner === "player"; }).length;
  hud.textContent = state.m.title + "  army " + mine.length + "  banners " + done + "/" + state.banners.length;
  var key = ["wedge", "stampede", "volley"].filter(function (n) { return state.powers[n]; })[0];
  document.getElementById("pow").textContent = key ? POWERS[key] : "Power";
  if (!mine.length) finish(false, "The host is gone.");
  else if (state.m.win === "clear" && !ea) finish(true, "Their host is broken.");
  else if (state.m.win === "banners" && done === state.banners.length) finish(true, "Every oath is sworn.");
  else if (state.m.win === "capital" && state.banners.some(function (b) { return b.capital && b.done && b.owner === "player"; }) && !ea) finish(true, "The capital flag is yours.");
}
function paint() {
  ctx.fillStyle = "#7d8f52"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#8b734f"; ctx.fillRect(W * 0.42, 0, 36, H);
  ctx.fillStyle = "#3e7394"; ctx.beginPath(); ctx.ellipse(W * 0.7, H * 0.78, 54, 22, 0, 0, 7); ctx.fill();
  var i;
  for (i = 0; i < 10; i++) { ctx.fillStyle = "#2f6a34"; ctx.beginPath(); ctx.arc(40 + i * 70, 30 + (i % 3) * 40, 12, 0, 7); ctx.fill(); }
  if (!state) return;
  state.banners.forEach(function (b) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 28, 0, 7);
    ctx.fillStyle = b.done ? (b.owner === "player" ? "rgba(240,197,106,.35)" : "rgba(122,31,31,.35)") : "rgba(247,236,212,.2)";
    ctx.fill(); ctx.strokeStyle = b.capital ? "#f0c56a" : "#f7ecd4"; ctx.stroke();
    ctx.fillStyle = "#1b130c"; ctx.fillRect(b.x - 1, b.y - 22, 3, 26);
    ctx.fillStyle = b.done && b.owner === "enemy" ? "#7a1f1f" : "#c45c1a";
    ctx.beginPath(); ctx.moveTo(b.x + 2, b.y - 22); ctx.lineTo(b.x + 16, b.y - 15); ctx.lineTo(b.x + 2, b.y - 8); ctx.fill();
    ctx.fillStyle = "#f7ecd4"; ctx.font = "13px Georgia"; ctx.textAlign = "center"; ctx.fillText(b.name, b.x, b.y + 44);
    if (!b.done) { ctx.fillStyle = "#1b130c"; ctx.fillRect(b.x - 20, b.y + 50, 40, 5); ctx.fillStyle = "#f0c56a"; ctx.fillRect(b.x - 20, b.y + 50, 40 * Math.max(0, b.progress) / b.hold, 5); }
  });
  state.units.filter(function (u) { return u.alive; }).forEach(function (u) {
    var spec = TYPES[u.type];
    if (u.sel) { ctx.strokeStyle = "#fff"; ctx.strokeRect(u.x - 12, u.y - 14, 24, 24); }
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(u.x, u.y + 8, 8, 3, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(u.x, u.y, spec.range > 40 ? 8 : 9, 0, 7);
    ctx.fillStyle = u.side === "player" ? spec.color : "#8a2424"; ctx.fill();
    ctx.strokeStyle = "#f7ecd4"; ctx.stroke();
    ctx.fillStyle = "#111"; ctx.fillRect(u.x - 9, u.y - 16, 18, 3);
    ctx.fillStyle = u.side === "player" ? "#f0c56a" : "#e07a6a"; ctx.fillRect(u.x - 9, u.y - 16, 18 * Math.max(0, u.hp / u.max), 3);
  });
}
function pool() {
  var sel = state.units.filter(function (u) { return u.alive && u.side === "player" && u.sel; });
  return sel.length ? sel : state.units.filter(function (u) { return u.alive && u.side === "player"; });
}
function attack() { if (!state) return; pool().forEach(function (u) { u.sel = true; u.hold = false; var f = nearest(u); if (f) { u.target = f; u.tx = f.x; u.ty = f.y; } }); say("Loosed."); }
function hold() { if (!state) return; pool().forEach(function (u) { u.sel = true; u.hold = true; u.target = null; u.tx = u.x; u.ty = u.y; }); say("Holding."); }
function power() {
  if (!state) return;
  var key = ["wedge", "stampede", "volley"].filter(function (k) { return state.powers[k] && state.cd[k] <= 0; })[0];
  if (!key) { say("Take a banner first."); return; }
  state.units.filter(function (u) { return u.alive && u.side === "player"; }).forEach(function (u) {
    var f = nearest(u, 160);
    if (key === "wedge" && u.type === "sword" && f) { f.hp -= 26; f.stun = 0.8; if (f.hp <= 0) f.alive = false; }
    if (key === "stampede" && (u.type === "horse" || u.type === "harc") && f) { f.hp -= 22; if (f.hp <= 0) f.alive = false; }
    if (key === "volley" && (u.type === "archer" || u.type === "harc") && f) { f.hp -= 18; if (f.hp <= 0) f.alive = false; }
  });
  state.cd[key] = 12; say(POWERS[key]);
}
function tap(e) {
  if (!state || state.over) return;
  var r = canvas.getBoundingClientRect();
  var t = e.changedTouches ? e.changedTouches[0] : e;
  var x = (t.clientX - r.left) * (canvas.width / r.width);
  var y = (t.clientY - r.top) * (canvas.height / r.height);
  var hit = null, i;
  for (i = state.units.length - 1; i >= 0; i--) if (state.units[i].alive && state.units[i].side === "player" && dist(state.units[i], { x: x, y: y }) < 20) hit = state.units[i];
  if (hit) { state.units.forEach(function (u) { u.sel = false; }); hit.sel = true; }
  else pool().forEach(function (u) { u.sel = true; u.hold = false; u.target = null; u.tx = x; u.ty = y; });
  if (e.cancelable) e.preventDefault();
}
canvas.addEventListener("pointerdown", tap);
canvas.addEventListener("touchstart", tap, { passive: false });
document.getElementById("all").onclick = function () { if (!state) return; state.units.forEach(function (u) { if (u.alive && u.side === "player") u.sel = true; }); };
document.getElementById("atk").onclick = attack;
document.getElementById("hold").onclick = hold;
document.getElementById("pow").onclick = power;
document.getElementById("back").onclick = function () { document.getElementById("end").classList.add("hide"); document.getElementById("menu").classList.remove("hide"); state = null; };
var list = document.getElementById("list");
for (var mi = 0; mi < MISSIONS.length; mi++) {
  (function (m) { var b = document.createElement("button"); b.type = "button"; b.textContent = m.title + " — " + m.brief; b.onclick = function () { start(m); }; list.appendChild(b); })(MISSIONS[mi]);
}
function loop(now) { var dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now; tick(dt); paint(); requestAnimationFrame(loop); }
fit(); window.addEventListener("resize", fit); requestAnimationFrame(loop);
say("Tap a mission below.");
</script>
</body>
</html>
