<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Age of Missalera</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #140e0a; color: #f7ecd4; font-family: Georgia, serif; }
  #app { height: 100dvh; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 8px 10px; background: linear-gradient(#4a301c, #24160e); border-bottom: 3px solid #e2b65a; display: flex; justify-content: space-between; gap: 8px; }
  b { color: #f0c56a; letter-spacing: .1em; font-size: 13px; }
  #hud { font-size: 12px; text-align: right; line-height: 1.3; }
  #stage { position: relative; flex: 1; min-height: 240px; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; background: #678046; }
  #log { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 2; background: rgba(16,10,6,.8); border: 1px solid #e2b65a; border-radius: 8px; padding: 7px 9px; font-size: 13px; }
  #controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; padding: 8px; background: #140e0a; }
  button { font-family: inherit; font-size: 15px; padding: 13px 4px; border-radius: 10px; border: 1px solid #e2b65a; background: #2a4466; color: #f7ecd4; }
  #menu, #end { position: absolute; inset: 0; z-index: 5; overflow: auto; background: rgba(8,6,4,.92); padding: 12px; }
  .card { background: #f6e7cb; color: #1b130c; border: 3px solid #6b4a28; border-radius: 12px; padding: 12px; }
  .card h1 { margin: 0 0 6px; font-size: 26px; }
  .card p { margin: 6px 0 10px; line-height: 1.35; }
  .card button { width: 100%; margin: 5px 0; text-align: left; background: #efe0c0; color: #1b130c; }
  .hide { display: none; }
</style>
</head>
<body>
<div id="app">
  <header><b>AGE OF MISSALERA</b><div id="hud">Six banners</div></header>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="log">Tap a mission. No extra download.</div>
    <div id="menu"><div class="card">
      <h1>Age of Missalera</h1>
      <p>You do not train. You collect. Hold a flag and its garrison swears in. Swords beat horses. Horses smash archers. Archers cut swords. Horse bows kite.</p>
      <div id="list"></div>
    </div></div>
    <div id="end" class="hide"><div class="card">
      <h1 id="endTitle">Done</h1>
      <p id="endText"></p>
      <button id="back" type="button">Six banners</button>
    </div></div>
  </div>
  <div id="controls">
    <button id="all" type="button">All</button>
    <button id="atk" type="button">Attack</button>
    <button id="hold" type="button">Hold</button>
    <button id="pow" type="button">Power</button>
  </div>
</div>
<script>
var TYPES = {
  sword: { name: "Swords", hp: 118, dmg: 15, range: 26, speed: 62, cd: 0.62 },
  horse: { name: "Horses", hp: 96, dmg: 18, range: 28, speed: 112, cd: 0.6 },
  harc: { name: "Horse bows", hp: 70, dmg: 9, range: 118, speed: 116, cd: 0.75 },
  archer: { name: "Archers", hp: 56, dmg: 11, range: 128, speed: 58, cd: 0.78 }
};
var POW = { wedge: "Wedge", stampede: "Stampede", volley: "Volley" };
var MISSIONS = [
  { title: "I · Dust Gate", brief: "Two flags. Learn the wedge.", start: [["sword", 6], ["archer", 2]], banners: [[0.34, 0.4, "Dust Gate", [["sword", 5]], "wedge"], [0.68, 0.62, "Well", [["archer", 3]]]], foes: [["sword", 5, 0.7, 0.34], ["archer", 4, 0.8, 0.55]], win: "clear" },
  { title: "II · Horse Road", brief: "The post pays in cavalry.", start: [["sword", 4], ["horse", 3]], banners: [[0.3, 0.3, "Mare Post", [["horse", 4]], "stampede"], [0.62, 0.68, "Ford", [["harc", 3]]]], foes: [["horse", 5, 0.76, 0.28], ["archer", 5, 0.78, 0.58]], win: "clear" },
  { title: "III · Orchard", brief: "Archers in the trees.", start: [["sword", 3], ["harc", 4]], banners: [[0.38, 0.28, "Orchard", [["harc", 4]], "volley"], [0.7, 0.7, "Kiln", [["sword", 4]]]], foes: [["archer", 8, 0.72, 0.32], ["sword", 4, 0.58, 0.5]], win: "clear" },
  { title: "IV · Three Oaths", brief: "Win by taking all three flags.", start: [["sword", 4], ["horse", 2], ["archer", 3]], banners: [[0.24, 0.32, "Steel", [["sword", 4]], "wedge"], [0.5, 0.66, "Hoof", [["horse", 3]], "stampede"], [0.76, 0.3, "String", [["archer", 4]], "volley"]], foes: [["sword", 5, 0.52, 0.28], ["horse", 4, 0.82, 0.52], ["archer", 5, 0.4, 0.74]], win: "banners" },
  { title: "V · Collector", brief: "Leave a flag and they take it.", start: [["sword", 5], ["horse", 2], ["archer", 3]], banners: [[0.38, 0.4, "Copper", [["sword", 5]], "wedge"], [0.66, 0.42, "Stable", [["horse", 3], ["harc", 2]], "stampede"]], foes: [["sword", 6, 0.52, 0.66], ["horse", 4, 0.82, 0.26], ["archer", 4, 0.78, 0.68]], enemyCollects: true, win: "clear" },
  { title: "VI · Capital", brief: "Four flags. Gold one is the capital.", start: [["sword", 6], ["horse", 3], ["harc", 2], ["archer", 3]], banners: [[0.26, 0.28, "West", [["sword", 4]], "wedge"], [0.26, 0.7, "Stables", [["horse", 3], ["harc", 2]], "stampede"], [0.5, 0.46, "Bell", [["archer", 4]], "volley"], [0.76, 0.36, "Capital", [["sword", 3], ["horse", 2]], null, 1]], foes: [["sword", 7, 0.72, 0.28], ["horse", 4, 0.84, 0.52], ["harc", 3, 0.66, 0.6], ["archer", 5, 0.78, 0.18]], win: "capital" }
];
var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
var hud = document.getElementById("hud"), logEl = document.getElementById("log");
var W = 360, H = 480, state = null, last = 0, shots = [];
function say(t) { logEl.textContent = t; }
function fit() { var s = document.getElementById("stage"); W = Math.max(300, s.clientWidth || innerWidth); H = Math.max(260, s.clientHeight || 460); canvas.width = W; canvas.height = H; }
function mk(type, side, x, y) { var s = TYPES[type]; return { type: type, side: side, x: x, y: y, hp: s.hp, max: s.hp, cd: Math.random() * 0.4, tx: x, ty: y, target: null, sel: false, stun: 0, alive: true, hold: false, face: 0 }; }
function group(list, side, ox, oy) { var out = [], i = 0, a, n; for (a = 0; a < list.length; a++) for (n = 0; n < list[a][1]; n++, i++) out.push(mk(list[a][0], side, ox + Math.cos(i * 0.8) * (14 + i % 3 * 8), oy + Math.sin(i * 0.8) * (14 + i % 3 * 8))); return out; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function nearest(u, max) { var best = null, bd = max || 9999, i, d; for (i = 0; i < state.units.length; i++) if (state.units[i].alive && state.units[i].side !== u.side) { d = dist(u, state.units[i]); if (d < bd) { bd = d; best = state.units[i]; } } return best; }
function bonus(a, d) { if (a === "sword" && d === "horse") return 1.7; if (a === "horse" && (d === "archer" || d === "harc")) return 1.6; if (a === "archer" && d === "sword") return 1.65; if (a === "harc" && d === "sword") return 1.3; if (a === "horse" && d === "sword") return 0.6; if (a === "sword" && d === "archer") return 0.7; return 1; }
function start(m) {
  fit(); shots = [];
  var units = group(m.start, "player", W * 0.14, H * 0.62), i, f;
  for (i = 0; i < m.foes.length; i++) { f = m.foes[i]; units = units.concat(group([[f[0], f[1]]], "enemy", W * f[2], H * f[3])); }
  state = { m: m, over: null, powers: {}, cd: { wedge: 0, stampede: 0, volley: 0 }, units: units, banners: m.banners.map(function (b) { return { x: W * b[0], y: H * b[1], name: b[2], grant: b[3], power: b[4], capital: b[5], progress: 0, done: false, owner: null, hold: b[5] ? 5.5 : 3.6 }; }), flash: 0 };
  document.getElementById("menu").classList.add("hide");
  document.getElementById("end").classList.add("hide");
  say(m.brief + " Tap grass to march.");
}
function claim(b, side) {
  if (b.done) return; b.done = true; b.owner = side;
  state.units = state.units.concat(group(b.grant, side, b.x, b.y + 28));
  if (side === "player" && b.power) state.powers[b.power] = true;
  say(side === "player" ? b.name + " joins you." + (b.power ? " " + POW[b.power] + " learned." : "") : "Enemy took " + b.name);
}
function move(u, x, y, s) { var d = Math.hypot(x - u.x, y - u.y); if (d < 1) return; var m = Math.min(s, d); u.face = Math.atan2(y - u.y, x - u.x); u.x += (x - u.x) / d * m; u.y += (y - u.y) / d * m; }
function end(win, text) { state.over = 1; document.getElementById("endTitle").textContent = win ? "Host holds" : "Host broken"; document.getElementById("endText").textContent = text; document.getElementById("end").classList.remove("hide"); }
function tick(dt) {
  if (!state || state.over) return;
  var i, u, spec, foe, b, p, e, mine, done;
  state.flash = Math.max(0, state.flash - dt);
  for (i in state.cd) state.cd[i] = Math.max(0, state.cd[i] - dt);
  for (i = 0; i < state.units.length; i++) {
    u = state.units[i]; if (!u.alive) continue;
    u.stun = Math.max(0, u.stun - dt); u.cd = Math.max(0, u.cd - dt);
    if (u.stun > 0) continue;
    spec = TYPES[u.type]; foe = u.target && u.target.alive ? u.target : null;
    if (!foe && !u.hold) foe = nearest(u, u.side === "enemy" ? 220 : 340);
    if (foe) {
      u.target = foe;
      if (dist(u, foe) <= spec.range) {
        if ((u.type === "archer" || u.type === "harc") && dist(u, foe) < spec.range * 0.4) move(u, u.x + (u.x - foe.x), u.y + (u.y - foe.y), spec.speed * dt);
        if (u.cd <= 0) {
          var hit = spec.dmg * bonus(u.type, foe.type); foe.hp -= hit; u.cd = spec.cd;
          if (u.type === "archer" || u.type === "harc") shots.push({ x: u.x, y: u.y, tx: foe.x, ty: foe.y, life: 0.2 });
          if (foe.hp <= 0) foe.alive = false;
        }
      } else move(u, foe.x, foe.y, spec.speed * dt);
    } else if (dist(u, { x: u.tx, y: u.ty }) > 6) move(u, u.tx, u.ty, spec.speed * dt);
  }
  for (i = 0; i < state.banners.length; i++) {
    b = state.banners[i]; if (b.done) continue;
    p = state.units.filter(function (u) { return u.alive && u.side === "player" && dist(u, b) < 58; }).length;
    e = state.units.filter(function (u) { return u.alive && u.side === "enemy" && dist(u, b) < 58; }).length;
    if (p > e && p) b.progress += dt; else if (state.m.enemyCollects && e > p && e) b.progress -= dt * 0.75; else b.progress = Math.max(0, b.progress - dt * 0.2);
    if (b.progress >= b.hold) claim(b, "player");
    if (b.progress <= -b.hold && state.m.enemyCollects) claim(b, "enemy");
  }
  shots = shots.filter(function (s) { return (s.life -= dt) > 0; });
  mine = state.units.filter(function (u) { return u.alive && u.side === "player"; });
  done = state.banners.filter(function (b) { return b.done && b.owner === "player"; }).length;
  hud.innerHTML = state.m.title + "<br>S " + count(mine, "sword") + " · H " + count(mine, "horse") + " · HB " + count(mine, "harc") + " · A " + count(mine, "archer") + " · flags " + done + "/" + state.banners.length;
  var key = ["wedge", "stampede", "volley"].filter(function (k) { return state.powers[k]; })[0];
  document.getElementById("pow").textContent = key ? POW[key] + (state.cd[key] > 0 ? " " + Math.ceil(state.cd[key]) : "") : "Power";
  if (!mine.length) end(false, "No one left to hold a flag.");
  else if (state.m.win === "clear" && !state.units.some(function (u) { return u.alive && u.side === "enemy"; })) end(true, "The field is yours.");
  else if (state.m.win === "banners" && done === state.banners.length) end(true, "Three oaths kept.");
  else if (state.m.win === "capital" && state.banners.some(function (b) { return b.capital && b.done && b.owner === "player"; }) && !state.units.some(function (u) { return u.alive && u.side === "enemy"; })) end(true, "Capital flag taken.");
}
function count(arr, t) { return arr.filter(function (u) { return u.type === t; }).length; }
function drawUnit(u) {
  var foe = u.side !== "player", x = u.x, y = u.y;
  ctx.save(); ctx.translate(x, y);
  if (u.sel) { ctx.strokeStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, 8, 14, 5, 0, 0, 7); ctx.stroke(); }
  ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(2, 9, 9, 3.5, 0, 0, 7); ctx.fill();
  if (u.type === "horse" || u.type === "harc") { ctx.fillStyle = foe ? "#4a2420" : "#6a431c"; ctx.beginPath(); ctx.ellipse(4, 2, 12, 6, 0.3, 0, 7); ctx.fill(); ctx.fillRect(10, -4, 3, 8); }
  ctx.fillStyle = foe ? "#9a3030" : (u.type === "archer" || u.type === "harc" ? "#2f4d6e" : "#8c3b2a");
  ctx.beginPath(); ctx.arc(-1, -3, 7, 0, 7); ctx.fill();
  ctx.fillStyle = "#e6c2a0"; ctx.beginPath(); ctx.arc(-1, -10, 3.5, 0, 7); ctx.fill();
  ctx.strokeStyle = "#1b130c"; ctx.lineWidth = 2;
  if (u.type === "sword" || u.type === "horse") { ctx.beginPath(); ctx.moveTo(4, -8); ctx.lineTo(11, -16); ctx.stroke(); }
  if (u.type === "archer" || u.type === "harc") { ctx.beginPath(); ctx.arc(7, -2, 5, -1.2, 1.2); ctx.stroke(); }
  ctx.fillStyle = "#111"; ctx.fillRect(-9, -18, 18, 3);
  ctx.fillStyle = foe ? "#e07a6a" : "#f0c56a"; ctx.fillRect(-9, -18, 18 * Math.max(0, u.hp / u.max), 3);
  ctx.restore();
}
function paint() {
  var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#8ea25e"); g.addColorStop(1, "#5f7540"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#8a7350"; ctx.fillRect(W * 0.46, 0, 28, H);
  ctx.fillStyle = "rgba(62,115,148,.55)"; ctx.beginPath(); ctx.ellipse(W * 0.72, H * 0.8, 60, 24, 0, 0, 7); ctx.fill();
  var i; for (i = 0; i < 12; i++) { ctx.fillStyle = "#2c6234"; ctx.beginPath(); ctx.arc((i * 97) % W, 24 + (i % 4) * 36, 11, 0, 7); ctx.fill(); ctx.fillStyle = "#5b3c24"; ctx.fillRect((i * 97) % W - 1, 30 + (i % 4) * 36, 3, 8); }
  if (!state) return;
  state.banners.forEach(function (b) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 32, 0, 7); ctx.fillStyle = b.done ? (b.owner === "player" ? "rgba(240,197,106,.3)" : "rgba(122,31,31,.35)") : "rgba(247,236,212,.15)"; ctx.fill();
    ctx.strokeStyle = b.capital ? "#f0c56a" : "#f7ecd4"; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = "#1b130c"; ctx.fillRect(b.x - 2, b.y - 26, 4, 30);
    ctx.fillStyle = b.done && b.owner === "enemy" ? "#6e1c1c" : (b.capital ? "#f0c56a" : "#c45c1a");
    ctx.beginPath(); ctx.moveTo(b.x + 2, b.y - 26); ctx.lineTo(b.x + 20, b.y - 17); ctx.lineTo(b.x + 2, b.y - 8); ctx.fill();
    ctx.fillStyle = "#f7ecd4"; ctx.font = "bold 13px Georgia"; ctx.textAlign = "center"; ctx.fillText(b.name, b.x, b.y + 48);
    if (!b.done) { ctx.fillStyle = "rgba(0,0,0,.5)"; ctx.fillRect(b.x - 22, b.y + 54, 44, 5); ctx.fillStyle = "#f0c56a"; ctx.fillRect(b.x - 22, b.y + 54, 44 * Math.max(0, b.progress) / b.hold, 5); }
  });
  shots.forEach(function (s) { ctx.strokeStyle = "#f7ecd4"; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.tx, s.ty); ctx.stroke(); });
  state.units.filter(function (u) { return u.alive; }).sort(function (a, b) { return a.y - b.y; }).forEach(drawUnit);
  if (state.flash > 0) { ctx.fillStyle = "rgba(247,236,212," + state.flash + ")"; ctx.fillRect(0, 0, W, H); }
}
function pool() { var s = state.units.filter(function (u) { return u.alive && u.side === "player" && u.sel; }); return s.length ? s : state.units.filter(function (u) { return u.alive && u.side === "player"; }); }
function attack() { if (!state) return; pool().forEach(function (u) { u.sel = true; u.hold = false; var f = nearest(u); if (f) { u.target = f; u.tx = f.x; u.ty = f.y; } }); say("Host loosed."); }
function hold() { if (!state) return; pool().forEach(function (u) { u.sel = true; u.hold = true; u.target = null; u.tx = u.x; u.ty = u.y; }); say("Holding the flag ground."); }
function power() {
  if (!state) return;
  var key = ["wedge", "stampede", "volley"].filter(function (k) { return state.powers[k] && state.cd[k] <= 0; })[0];
  if (!key) { say("No power yet. Take the flag that teaches it."); return; }
  state.units.forEach(function (u) {
    if (!u.alive || u.side !== "player") return;
    var f = nearest(u, 170);
    if (!f) return;
    if (key === "wedge" && u.type === "sword") { f.hp -= 28; f.stun = 0.9; }
    if (key === "stampede" && (u.type === "horse" || u.type === "harc")) { move(u, f.x, f.y, 70); f.hp -= 24; }
    if (key === "volley" && (u.type === "archer" || u.type === "harc")) { f.hp -= 20; shots.push({ x: u.x, y: u.y, tx: f.x, ty: f.y, life: 0.25 }); }
    if (f.hp <= 0) f.alive = false;
  });
  state.cd[key] = 11; state.flash = 0.25; say(POW[key] + " fired.");
}
function tap(e) {
  if (!state || state.over) return;
  var r = canvas.getBoundingClientRect(), t = e.changedTouches ? e.changedTouches[0] : e;
  var x = (t.clientX - r.left) * (canvas.width / r.width), y = (t.clientY - r.top) * (canvas.height / r.height), hit = null, i;
  for (i = state.units.length - 1; i >= 0; i--) if (state.units[i].alive && state.units[i].side === "player" && dist(state.units[i], { x: x, y: y }) < 22) hit = state.units[i];
  if (hit) { state.units.forEach(function (u) { u.sel = false; }); hit.sel = true; say("One soldier. Tap grass to move him."); }
  else { pool().forEach(function (u) { u.sel = true; u.hold = false; u.target = null; u.tx = x + (Math.random() - 0.5) * 18; u.ty = y + (Math.random() - 0.5) * 18; }); say("Marching."); }
  if (e.cancelable) e.preventDefault();
}
canvas.addEventListener("pointerdown", tap);
canvas.addEventListener("touchstart", tap, { passive: false });
document.getElementById("all").onclick = function () { if (state) state.units.forEach(function (u) { if (u.alive && u.side === "player") u.sel = true; }); say("Whole host."); };
document.getElementById("atk").onclick = attack;
document.getElementById("hold").onclick = hold;
document.getElementById("pow").onclick = power;
document.getElementById("back").onclick = function () { document.getElementById("end").classList.add("hide"); document.getElementById("menu").classList.remove("hide"); state = null; hud.textContent = "Six banners"; };
var list = document.getElementById("list");
MISSIONS.forEach(function (m) { var b = document.createElement("button"); b.type = "button"; b.innerHTML = "<b>" + m.title + "</b><br>" + m.brief; b.onclick = function () { start(m); }; list.appendChild(b); });
function loop(now) { var dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now; tick(dt); paint(); requestAnimationFrame(loop); }
fit(); addEventListener("resize", fit); requestAnimationFrame(loop);
</script>
</body>
</html>
